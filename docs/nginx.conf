# Da mettere nel contesto http (es. /etc/nginx/conf.d/alienshop-limits.conf):
#   limit_req_zone $binary_remote_addr zone=alien_login:10m rate=10r/m;
#   server_tokens off;

server {
    listen 80;
    server_name example.com;
    root /var/www/alienshop/public;
    index index.php;

    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;

    location ~* \.(css|js|webp|jpg|jpeg|png|gif|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /uploads/ {
        location ~ \.php$ { return 403; }
        try_files $uri =404;
    }

    location ~ /\.(?!well-known/) {
        deny all;
        return 404;
    }

    location ~ ^/(admin/login|account/login|account/forgot|account/register)$ {
        limit_req zone=alien_login burst=5 nodelay;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
}
